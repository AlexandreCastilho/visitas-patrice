<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Visitas">
<meta name="theme-color" content="#f4f5f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Visitas</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --txt: #1b1f24; --sub: #66707a; --line: #e3e6ea;
    --azul: #0b6bcb; --verde: #1f8a4c; --amarelo: #b7791f; --vermelho: #c53030; --cinza: #8a939c;
    --A: #0b6bcb; --B: #6b46c1; --C: #4a5568;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111417; --card: #1b1f24; --txt: #eef1f4; --sub: #9aa4ae; --line: #2a3037;
      --azul: #4ea1ff; --verde: #48bb78; --amarelo: #ecc94b; --vermelho: #fc8181; --cinza: #718096;
      --A: #4ea1ff; --B: #a78bfa; --C: #a0aec0; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 10px) 14px 8px; border-bottom: 1px solid var(--line); }
  .topo { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 24px; margin: 0; }
  .sub { color: var(--sub); font-size: 13px; }
  button { font: inherit; color: inherit; }
  .icone { background: none; border: 0; font-size: 22px; padding: 4px 6px; cursor: pointer; }
  .resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 8px; }
  .resumo button { background: var(--card); border: 2px solid transparent; border-radius: 12px;
    padding: 8px 6px; text-align: left; cursor: pointer; }
  .resumo button.ativo { border-color: var(--azul); }
  .resumo b { display: block; font-size: 20px; }
  .resumo span { font-size: 12px; color: var(--sub); }
  .controles { display: flex; gap: 8px; }
  input[type=search] { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--txt); font-size: 16px; }
  select { padding: 9px 8px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--txt); font-size: 15px; }
  .filtros { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 5px 12px; font-size: 14px; cursor: pointer; }
  .chip.ativo { background: var(--azul); border-color: var(--azul); color: #fff; }
  main { padding: 10px 12px calc(env(safe-area-inset-bottom) + 24px); }
  .card { background: var(--card); border-radius: 14px; padding: 12px 12px 10px; margin-bottom: 10px;
    border-left: 5px solid var(--cinza); }
  .card.ok { border-left-color: var(--verde); }
  .card.perto { border-left-color: var(--amarelo); }
  .card.atrasado, .card.nunca { border-left-color: var(--vermelho); }
  .linha1 { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .nome { font-weight: 600; font-size: 16px; }
  .dias { text-align: right; flex: none; }
  .dias b { display: block; font-size: 22px; line-height: 1; }
  .dias small { font-size: 11px; color: var(--sub); }
  .ok .dias b { color: var(--verde); } .perto .dias b { color: var(--amarelo); }
  .atrasado .dias b, .nunca .dias b { color: var(--vermelho); }
  .meta { color: var(--sub); font-size: 13px; margin-top: 4px; }
  .grupo { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; border-radius: 5px;
    padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
  .gA { background: var(--A); } .gB { background: var(--B); } .gC { background: var(--C); }
  .acoes { display: flex; gap: 14px; margin-top: 8px; font-size: 14px; }
  .acoes a, .acoes button { color: var(--azul); text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; }
  .detalhe { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--sub); }
  .card.aberto .detalhe { display: block; }
  .vazio, .aviso { text-align: center; color: var(--sub); padding: 40px 20px; }
  .aviso b { color: var(--txt); display: block; font-size: 18px; margin-bottom: 6px; }
  dialog { border: 0; border-radius: 16px; padding: 18px; width: min(92vw, 380px);
    background: var(--card); color: var(--txt); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h2 { margin: 0 0 6px; font-size: 18px; }
  dialog label { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
  dialog input { width: 80px; padding: 7px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--txt); font-size: 16px; text-align: right; }
  dialog .botoes { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
  dialog .botoes button { border: 0; border-radius: 10px; padding: 8px 14px; background: var(--azul); color: #fff; cursor: pointer; }
  dialog .botoes button.sec { background: var(--line); color: var(--txt); }
</style>
</head>
<body>
<header>
  <div class="topo">
    <div>
      <h1>Visitas</h1>
      <div class="sub" id="atualizado">Carregando…</div>
    </div>
    <button class="icone" id="btnConfig" aria-label="Configurações">⚙️</button>
  </div>
  <div class="resumo" id="resumo"></div>
  <div class="controles">
    <input type="search" id="busca" placeholder="Buscar médico ou endereço" autocomplete="off">
    <select id="ordem" aria-label="Ordenar">
      <option value="urgencia">Mais urgentes</option>
      <option value="perto">Perto de mim</option>
      <option value="posicao">Ranking ABC</option>
    </select>
  </div>
  <div class="filtros" id="filtros">
    <button class="chip" data-f="atrasados">Só atrasados</button>
    <button class="chip" data-f="todos">Todos</button>
  </div>
</header>
<main id="lista"><div class="vazio">Carregando…</div></main>

<dialog id="dlgConfig">
  <h2>Frequência de visitas</h2>
  <div class="sub">De quantos em quantos dias cada grupo deve ser visitado.</div>
  <label>Grupo A <input type="number" id="limA" min="1" inputmode="numeric"></label>
  <label>Grupo B <input type="number" id="limB" min="1" inputmode="numeric"></label>
  <label>Grupo C <input type="number" id="limC" min="1" inputmode="numeric"></label>
  <div class="sub" id="infoDados" style="margin-top:12px"></div>
  <div class="botoes">
    <button class="sec" id="btnCancelar">Cancelar</button>
    <button id="btnSalvar">Salvar</button>
  </div>
</dialog>

<script>
(() => {
  const LS = { chave: 'visitas.chave', lim: 'visitas.limites', grupo: 'visitas.grupo', ordem: 'visitas.ordem' };
  const PADRAO = { A: 30, B: 60, C: 90 };
  const $ = (id) => document.getElementById(id);
  let dados = null, pos = null;
  let estado = {
    grupo: localStorage.getItem(LS.grupo) || 'A',
    filtro: 'todos',
    ordem: localStorage.getItem(LS.ordem) || 'urgencia',
    busca: '',
  };
  if (estado.ordem === 'perto') estado.ordem = 'urgencia'; // geolocalização só quando ela pedir
  const limites = () => Object.assign({}, PADRAO, JSON.parse(localStorage.getItem(LS.lim) || '{}'));

  // ---- chave: vem uma vez pelo link de configuração (#k=...) e fica guardada no aparelho
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get('k')) {
    // A chave fica também no endereço: no iPhone, o ícone da tela de início
    // guarda o endereço atual e tem armazenamento separado do navegador.
    localStorage.setItem(LS.chave, hash.get('k'));
  }

  function b64(s) { return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); }
  function b64url(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return b64(s); }

  async function carregar() {
    const k = localStorage.getItem(LS.chave);
    if (!k) return aviso('App ainda não configurado', 'Abra o link de configuração que o Alexandre enviou, uma única vez, neste aparelho.');
    let enc;
    try {
      const r = await fetch('data.enc?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      enc = await r.json();
    } catch (e) {
      return aviso('Sem conexão', 'Não consegui baixar os dados. Verifique a internet e puxe a tela para atualizar.');
    }
    try {
      const key = await crypto.subtle.importKey('raw', b64url(k), 'AES-GCM', false, ['decrypt']);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(enc.iv) }, key, b64(enc.ct));
      dados = JSON.parse(new TextDecoder().decode(pt));
    } catch (e) {
      localStorage.removeItem(LS.chave);
      return aviso('Chave inválida', 'Abra de novo o link de configuração que o Alexandre enviou.');
    }
    const g = new Date(dados.geradoEm);
    $('atualizado').textContent = 'Atualizado ' + quando(g);
    $('infoDados').textContent = `Dados de ${fmtData(dados.historicoDesde)} até ${fmtData(dados.ultimoCheck)} · ${dados.totalChecks} registros no minhavisita.`;
    render();
  }

  function aviso(titulo, texto) {
    $('atualizado').textContent = '';
    $('lista').innerHTML = `<div class="aviso"><b>${titulo}</b>${texto}</div>`;
  }

  // ---- utilidades
  const HOJE = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  function diasDesde(iso) {
    if (!iso) return null;
    const d = new Date(iso); d.setHours(0, 0, 0, 0);
    return Math.round((HOJE() - d) / 864e5);
  }
  function fmtData(iso) { return iso ? new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' }) : '—'; }
  function fmtDia(d) { const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y.slice(2)}`; }
  function quando(d) {
    const dias = diasDesde(d.toISOString());
    const h = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    return dias === 0 ? `hoje às ${h}` : dias === 1 ? `ontem às ${h}` : `em ${fmtData(d.toISOString())}`;
  }
  const MIN = new Set(['DE', 'DA', 'DO', 'DAS', 'DOS', 'E', 'DEL', 'DI']);
  function titulo(s) {
    return s.toLowerCase().split(' ').map((w, i) => (i && MIN.has(w.toUpperCase()) ? w : w.charAt(0).toUpperCase() + w.slice(1))).join(' ');
  }
  function norm(s) { return String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function distKm(a, b, c, d) {
    const R = 6371, r = Math.PI / 180;
    const x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  const moeda = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });

  function situacao(m, lim) {
    const d = diasDesde(m.u);
    const l = lim[m.g];
    if (d === null) return { cls: 'nunca', dias: null, score: 1e9 - m.p, atrasado: true };
    const cls = d > l ? 'atrasado' : d > l * 0.75 ? 'perto' : 'ok';
    return { cls, dias: d, score: d / l, atrasado: d > l };
  }

  // ---- tela
  function render() {
    if (!dados) return;
    const lim = limites();
    const todos = dados.medicos.map((m) => Object.assign({ s: situacao(m, lim) }, m));

    // resumo por grupo
    $('resumo').innerHTML = ['A', 'B', 'C'].map((g) => {
      const doGrupo = todos.filter((m) => m.g === g);
      const atr = doGrupo.filter((m) => m.s.atrasado).length;
      return `<button data-g="${g}" class="${estado.grupo === g ? 'ativo' : ''}">
        <b>${atr}<span style="font-size:13px;color:var(--sub);font-weight:400"> / ${doGrupo.length}</span></b>
        <span>Grupo ${g} atrasados</span></button>`;
    }).join('');

    document.querySelectorAll('#filtros .chip').forEach((c) => c.classList.toggle('ativo', c.dataset.f === estado.filtro));
    $('ordem').value = estado.ordem;

    let lista = todos.filter((m) => m.g === estado.grupo);
    if (estado.filtro === 'atrasados') lista = lista.filter((m) => m.s.atrasado);
    if (estado.busca) {
      const q = norm(estado.busca);
      lista = todos.filter((m) => norm(m.n).includes(q) || norm(m.e).includes(q));
    }
    if (estado.ordem === 'perto' && pos) {
      lista.forEach((m) => { m.km = m.la != null ? distKm(pos.lat, pos.lng, m.la, m.lo) : 1e6; });
      lista.sort((a, b) => a.km - b.km);
    } else if (estado.ordem === 'posicao') {
      lista.sort((a, b) => a.p - b.p);
    } else {
      lista.sort((a, b) => b.s.score - a.s.score || a.p - b.p);
    }

    if (!lista.length) {
      $('lista').innerHTML = `<div class="vazio">${estado.busca ? 'Nenhum médico encontrado.' : 'Nenhum médico atrasado neste grupo. 🎉'}</div>`;
      return;
    }
    $('lista').innerHTML = lista.map(card).join('');
  }

  function card(m) {
    const s = m.s;
    const diasTxt = s.dias === null ? '<b>—</b><small>sem visita</small>'
      : s.dias === 0 ? '<b>hoje</b><small>última visita</small>'
      : `<b>${s.dias}d</b><small>sem visita</small>`;
    const ult = m.u ? `Última visita: ${fmtData(m.u)}` : (m.cad ? 'Sem visita presencial registrada' : 'Não encontrado no minhavisita');
    const km = m.km != null && m.km < 1e5 ? ` · ${m.km < 1 ? Math.round(m.km * 1000) + ' m' : m.km.toFixed(1).replace('.', ',') + ' km'}` : '';
    const mapa = m.la != null
      ? `https://maps.apple.com/?q=${encodeURIComponent(titulo(m.n))}&ll=${m.la},${m.lo}`
      : m.e ? `https://maps.apple.com/?q=${encodeURIComponent(m.e)}` : '';
    const hist = m.h && m.h.length ? m.h.map(fmtDia).join(' · ') : 'nenhuma';
    return `<div class="card ${s.cls}">
      <div class="linha1">
        <div>
          <div class="nome"><span class="grupo g${m.g}">${m.g}${m.p}</span>${esc(titulo(m.n))}</div>
          <div class="meta">${ult}${km}</div>
        </div>
        <div class="dias">${diasTxt}</div>
      </div>
      <div class="acoes">
        ${mapa ? `<a href="${mapa}" target="_blank" rel="noopener">📍 Mapa</a>` : ''}
        <button data-abrir>Detalhes</button>
      </div>
      <div class="detalhe">
        ${m.e ? esc(m.e) + '<br>' : ''}
        Visitas nos últimos 12 meses: <b>${m.v12}</b><br>
        Últimas visitas: ${hist}<br>
        ${m.on ? 'Última reunião online: ' + fmtData(m.on) + '<br>' : ''}
        Faturamento jan–set: ${moeda(m.t)} · ativo em ${m.ma} de 9 meses
      </div>
    </div>`;
  }

  // ---- eventos
  $('resumo').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-g]'); if (!b) return;
    estado.grupo = b.dataset.g; localStorage.setItem(LS.grupo, estado.grupo);
    estado.busca = ''; $('busca').value = '';
    render(); window.scrollTo(0, 0);
  });
  $('filtros').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    estado.filtro = b.dataset.f; render();
  });
  $('busca').addEventListener('input', (e) => { estado.busca = e.target.value.trim(); render(); });
  $('ordem').addEventListener('change', (e) => {
    estado.ordem = e.target.value; localStorage.setItem(LS.ordem, estado.ordem);
    if (estado.ordem === 'perto') {
      if (!navigator.geolocation) { alert('Localização indisponível neste aparelho.'); return; }
      $('atualizado').textContent = 'Buscando sua localização…';
      navigator.geolocation.getCurrentPosition(
        (p) => { pos = { lat: p.coords.latitude, lng: p.coords.longitude }; $('atualizado').textContent = 'Atualizado ' + quando(new Date(dados.geradoEm)); render(); },
        () => { estado.ordem = 'urgencia'; $('atualizado').textContent = 'Permita o acesso à localização para usar “Perto de mim”.'; render(); },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
    } else render();
  });
  $('lista').addEventListener('click', (e) => {
    if (e.target.closest('[data-abrir]')) e.target.closest('.card').classList.toggle('aberto');
  });
  $('btnConfig').addEventListener('click', () => {
    const l = limites(); $('limA').value = l.A; $('limB').value = l.B; $('limC').value = l.C;
    $('dlgConfig').showModal();
  });
  $('btnCancelar').addEventListener('click', () => $('dlgConfig').close());
  $('btnSalvar').addEventListener('click', () => {
    const v = (id, d) => Math.max(1, parseInt($(id).value, 10) || d);
    localStorage.setItem(LS.lim, JSON.stringify({ A: v('limA', 30), B: v('limB', 60), C: v('limC', 90) }));
    $('dlgConfig').close(); render();
  });
  // Recarrega ao voltar para o app (ex.: depois de abrir o mapa)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && dados && Date.now() - new Date(dados.geradoEm) > 30 * 60e3) carregar();
  });

  carregar();
})();
</script>
</body>
</html>
